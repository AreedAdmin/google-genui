[project]
name = "trellis-analysis"
version = "0.1.0"
description = "Trellis dependency-analysis service: tree-sitter + networkx symbol/import/call graphs for grounded dependency inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "tree-sitter>=0.23.0,<0.24.0",
    "tree-sitter-languages>=1.10.2,<2.0.0",
    "networkx>=3.4.0,<4.0.0",
    "redis>=5.2.0,<6.0.0",
]

[project.optional-dependencies]
# Fallback grammar packages if tree-sitter-languages does not load on the host.
grammars = [
    "tree-sitter-typescript>=0.23.0,<0.24.0",
    "tree-sitter-javascript>=0.23.0,<0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
